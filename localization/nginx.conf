worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 10820;
        root /srv/dashboard;
        location = /app { return 302 /app/; }
        location = /app/index.html { return 302 /app/; }
        location = /app/ {
            default_type text/html;
            try_files /index.html =404;
            include /etc/nginx/localized-headers.conf;
        }
        location = /app/app.js {
            alias /srv/dashboard/app.js;
            include /etc/nginx/localized-headers.conf;
        }
        location = /app/app.css {
            alias /srv/dashboard/app.css;
            include /etc/nginx/localized-headers.conf;
        }
        location = /app/icon.png {
            alias /srv/dashboard/icon.png;
            include /etc/nginx/localized-headers.conf;
        }
        location / {
            # Keep all authenticated API, sign-in links, flags and SSE in Core.
            set $core_upstream core:10820;
            proxy_pass http://$core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # This is a browser gateway, not the privileged local desktop API.
            proxy_set_header X-Local-Token "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
